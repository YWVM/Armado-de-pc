<style>
  :root{
    --bg:#f7f7f8; --surface:#ffffff; --muted:#f0f0f2; --border:#e2e2e6;
    --text:#1a1a1c; --text2:#55565c; --text3:#8b8c93;
    --chip:#ececef; --accent:#1a1a1c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#131316; --surface:#1c1c20; --muted:#26262c; --border:#34343c;
      --text:#f0f0f2; --text2:#b6b7be; --text3:#7d7e86; --chip:#2b2b32; --accent:#f0f0f2; }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.55;}
  .app{max-width:860px; margin:0 auto; padding:20px 16px 64px;}
  header.app-head{padding:24px 0 8px;}
  .kicker{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--text3);}
  h1{font-size:24px; font-weight:600; margin-top:4px;}
  .sub{color:var(--text2); font-size:14px; margin-top:6px;}
  .crumb{display:flex; align-items:center; gap:8px; margin:16px 0 12px; font-size:13px;}
  .crumb button{background:none;border:none;color:var(--text2);cursor:pointer;font:inherit;
    display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;}
  .crumb button:hover{background:var(--muted); color:var(--text);}
  .view{animation:fade .18s ease-out;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .folders{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:12px;}
  .folder{background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:16px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px;
    transition:border-color .15s, transform .15s; font:inherit; color:inherit;}
  .folder:hover{border-color:var(--text3); transform:translateY(-2px);}
  .folder .fico{width:36px;height:36px;border-radius:8px;background:var(--chip);
    display:flex;align-items:center;justify-content:center;}
  .folder .ft{font-weight:600; font-size:15px;}
  .folder .fc{font-size:12px; color:var(--text3);}
  .row{background:var(--surface); border:1px solid var(--border); border-radius:10px;
    width:100%; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;
    font:inherit; color:inherit; text-align:left; transition:border-color .15s; margin-bottom:8px;}
  .row:hover{border-color:var(--text3);}
  .row .rn{font-weight:500; font-size:15px; flex:1;}
  .row .arrow{color:var(--text3); flex:none;}
  .sec-title{font-size:19px; font-weight:600; margin:4px 0 4px;}
  .sec-note{font-size:13px; color:var(--text2); margin-bottom:16px;}
  article{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px;}
  article h3{font-size:17px; font-weight:600; margin-bottom:12px;}
  article p{margin:0 0 12px; font-size:15px; color:var(--text);}
  article ul{margin:0 0 14px 20px; font-size:15px;}
  article li{margin-bottom:6px;}
  .steps{counter-reset:paso; margin:0 0 14px; list-style:none;}
  .steps li{counter-increment:paso; position:relative; padding:10px 12px 10px 44px;
    background:var(--muted); border-radius:8px; margin-bottom:8px; font-size:14.5px;}
  .steps li::before{content:counter(paso); position:absolute; left:12px; top:10px;
    width:22px;height:22px;border-radius:50%; background:var(--accent); color:var(--bg);
    font-size:12px; font-weight:600; display:flex;align-items:center;justify-content:center;}
  .tip{border-left:3px solid var(--text); background:var(--muted); border-radius:0 8px 8px 0;
    padding:10px 14px; font-size:14px; color:var(--text); margin:0 0 14px;}
  .tip b{font-weight:600;}
  .lab{border:1px dashed var(--text3); border-radius:10px; padding:12px 14px; font-size:13.5px;
    color:var(--text2); margin-top:16px;}
  .terms{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 12px;}
  .term{background:var(--chip); border-radius:6px; padding:6px 10px; font-size:13px;}
  .kv{font-size:14.5px; margin-bottom:10px;}
  .kv b{font-weight:600;}
  footer{margin-top:28px; font-size:12px; color:var(--text3); text-align:center;}
  svg{display:block;}
</style>
<base target="_blank">
</head>

const main = document.getElementById("main");
const crumb = document.getElementById("crumb");
const crumbLabel = document.getElementById("crumbLabel");
const backBtn = document.getElementById("backBtn");
let stack = [];

function icon(name){ return ICO[name] || ICO.folder; }
function showCrumb(label){ crumb.style.display = label ? "flex" : "none"; crumbLabel.textContent = label || ""; }

function renderHome(){
  stack = []; showCrumb("");
  document.getElementById("appTitle").textContent = "Capítulo 2: Armado de PC";
  main.innerHTML = '<div class="view"><div class="folders">' + DATA.map((d,i)=>
    '<button class="folder" data-i="'+i+'"><span class="fico">'+icon(d.icon)+'</span>'+
    '<span class="ft">'+d.title+'</span>'+
    '<span class="fc">'+d.subs.length+' subtemas</span></button>').join("") + '</div></div>';
  main.querySelectorAll(".folder").forEach(b=>b.onclick=()=>renderFolder(+b.dataset.i));
  window.scrollTo({top:0});
}

function renderFolder(i){
  const d = DATA[i]; stack = [{v:"folder", i}];
  showCrumb(d.title);
  document.getElementById("appTitle").textContent = d.title;
  main.innerHTML = '<div class="view"><div class="sec-title">'+d.title+'</div>'+
    '<div class="sec-note">Toca un subtema para ver su explicación completa.</div>'+
    d.subs.map((s,j)=>'<button class="row" data-j="'+j+'">'+
      '<span style="color:var(--text3)">'+icon(d.icon)+'</span>'+
      '<span class="rn">'+s.t+'</span>'+
      '<span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>'+
    '</button>').join("")+'</div>';
  main.querySelectorAll(".row").forEach(b=>b.onclick=()=>renderDetail(i,+b.dataset.j));
  window.scrollTo({top:0});
}

function renderDetail(i,j){
  const d = DATA[i], s = d.subs[j]; stack = [{v:"folder",i},{v:"detail",i,j}];
  showCrumb(d.title + " › " + s.t);
  const html = s.blocks.map(b=>{
    if(b.t==="p") return "<p>"+b.x+"</p>";
    if(b.t==="list") return "<ul>"+b.items.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
    if(b.t==="steps") return '<ol class="steps">'+b.items.map(x=>"<li>"+x+"</li>").join("")+"</ol>";
    if(b.t==="tip") return '<div class="tip"><b>Consejo.</b> '+b.x+"</div>";
    if(b.t==="terms") return '<div class="terms">'+b.items.map(x=>'<span class="term">'+x+"</span>").join("")+"</div>";
    if(b.t==="kv") return b.items.map(pair=>'<div class="kv"><b>'+pair[0]+':</b> '+pair[1]+"</div>").join("");
    if(b.t==="lab") return '<div class="lab"><b>Práctica de laboratorio.</b> '+b.x+"</div>";
    return "";
  }).join("");
  main.innerHTML = '<div class="view"><article><h3>'+s.t+'</h3>'+html+'</article></div>';
  window.scrollTo({top:0});
}

backBtn.onclick = ()=>{
  if(stack.length && stack[stack.length-1].v==="detail"){ renderFolder(stack[0].i); }
  else renderHome();
};

renderHome();
</script>
